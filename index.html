.recipe-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(310px,.82fr);gap:19px;align-items:start}.recipe-col{display:flex;flex-direction:column;gap:19px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 9px 29px rgba(46,28,15,.028);overflow:hidden}.panel__top{padding:22px 25px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}.panel__top h2{font-size:21px;font-weight:900;margin:4px 0 0;line-height:1.55}.panel__top .meta{font-size:10px;color:var(--muted);white-space:nowrap}.panel__body{padding:0 25px 22px}.ingredient-head{display:grid;grid-template-columns:24px minmax(0,1fr) 110px;gap:10px;align-items:center;padding:11px 0 8px;font-size:9px;font-weight:800;color:#aa9a8c;letter-spacing:.6px}.ingredient{display:grid;grid-template-columns:24px minmax(0,1fr) 110px;gap:10px;align-items:center;padding:13px 0;border-top:1px solid #f0e9e1}.checkline{width:21px;height:21px;border-radius:6px;border:1px solid #d0c4b5;background:transparent;display:grid;place-items:center;color:#fff}.checkline svg{width:13px;height:13px;opacity:0}.checkline.checked{background:#7da558;border-color:#7da558}.checkline.checked svg{opacity:1}.ingredient.checked .ingredient-name{text-decoration:line-through;color:#b2a59b}.ingredient-name{font-size:13px;font-weight:800;line-height:1.5;display:block}.ingredient-code{font:700 10px/1.4 monospace;color:#9b8176;direction:ltr;display:inline-block;margin-top:3px}.ingredient-quantity{display:flex;align-items:baseline;justify-content:flex-end;gap:5px;direction:ltr;white-space:nowrap}.ingredient-quantity b{font-size:22px;font-weight:900;color:var(--wine);letter-spacing:-1px}.ingredient-quantity small{font-size:10px;color:var(--muted);font-weight:700}.ingredient-quantity .missing{font-size:11px;color:#b66a29}.ingredient-info{font-size:9px;color:#a66b31;margin-top:4px}.ingredient-progress{display:flex;justify-content:space-between;align-items:c .steps-note{margin:20px 23px 12px;display:flex;align-items:flex-start;gap:12px;background:#fff5e2;border:1px solid #f0dfbb;padding:13px;border-radius:9px}.steps-note svg{width:17px;height:17px;flex-shrink:0;color:#bf8a33;margin-top:2px}.steps-note strong{font-size:11px;color:#7c532c;display:block}.steps-note p{margin:2px 0 0;color:#997b56;font-size:10px;line-height:1.9}.steps-note.approved{background:#eaf2e0;border-color:#d8e7c6}.steps-note.approved strong{color:#52733c}.steps-note.approved p{color:#657d53}.steps-note.approved svg{color:#6e9450}.steps{padding:0 24px 14px}.step{display:grid;grid-template-columns:36px 1fr 20px;gap:12px;align-items:flex-start;padding:15px 0;border-bottom:1px solid #f1e9e1;cursor:pointer}.step:last-child{border:0}.step__no{border-radius:50%;width:35px;height:35px;background:#f4ede2;display:grid;place-items:center;font:800 12px monospace;color:var(--wine)}.step__text{font-size:12px;line-height:2;color:#514239;margin:2px 0}.step__check{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;border:1px solid #d7c9b8;margin-top:9px;color:transparent}.step.done .step__no{background:var(--green);color:var(--brown)}.step.done .step__check{background:var(--green);border-color:var(--green);color:var(--brown)}.step.done .step__text{color:#aaa097;text-decoration:line-through}.step-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 24px 23px}.step-actions .button{padding:8px 14px;font-size:10px}.step-actions small{color:var(--muted);font-size:10px}

function editIngredients(id){if(!state.isEditor)return showLogin();const it=byId.get(id);if(!it)return;const fieldRows=(rows,type)=>rows.map((v,i)=>`<div class="editor-row" data-type="${type}" data-index="${i}"><div><strong>${esc(v.name)}</strong><small>${esc(v.code)}</small></div><div><label>الكمية</label><input type="number" step="any" min="0" value="${v.qty===null?'':esc(v.qty)}" data-field="qty" aria-label="كمية ${esc(v.name)}"></div><div><label>الوحدة</label><input type="text" value="${esc(v.unit)}" data-field="unit" aria-label="وحدة ${esc(v.name)}"></div></div>`).join('');showDialog(`مقادير ${it.name}`,`<p>ظبّط الكمية والوحدة لكل مكوّن أو مستلزم تقديم.</p><div class="editor-rows"><div class="editor-group-title">المكونات</div>${fieldRows(it.ingredients,'ingredient')}<div class="editor-group-title">التقديم</div>${fieldRows(it.packaging,'packaging')}</div>`,`<button class="button secondary" data-action="close-modal">إلغاء</button><button class="button wine" data-action="save-ingredients" data-id="${esc(id)}">${icon('check')} احفظ المقادير</button>`)}
function saveIngredients(id){if(!state.isEditor)return showLogin();const it=byId.get(id),root=document.querySelector('.modal');if(!it||!root)return;let ingredients=it.ingredients.map(r=>({...r})),packaging=it.packaging.map(r=>({...r}));for(const row of root.querySelectorAll('.editor-row')){const a=row.dataset.type==='ingredient'?ingredients:packaging,v=a[+row.dataset.index];if(!v)continue;const qty=row.querySelector('[data-field="qty"]').value,unit=row.querySelector('[data-field="unit"]').value.trim();if(qty!==''&&(!Number.isFinite(Number(qty))||Number(qty)<0)){toast('راجع الكمية المكتوبة');return}v.qty=qty===''?null:Number(qty);v.unit=unit}state.itemOverrides[id]={ingredients,packaging,updatedAt:new Date().toISOString()};localStorage.setItem('elnoubey_items_v3',JSON.stringify(state.itemOverrides));it.ingredients=ingredients;it.packaging=packaging;state.checked[id]=[];document.getElementById('modal-container').innerHTML='';render();toast('المقادير اتحفظت')}
const hexToBytes=(hex)=>new Uint8Array(hex.match(/.{2}/g).map(x=>parseInt(x,16)));
const toHex=a=>Array.from(new Uint8Array(a)).map(b=>b.toString(16).padStart(2,'0')).join('');
async function passwordHash(pass,salt,iterations){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hexToBytes(salt),iterations,hash:'SHA-256'},key,256);return toHex(bits)}
function showLogin(){showDialog('دخول المشرف',`<p>التعديل للمشرف بس. ادخل بياناتك عشان تفتح أدوات التحرير.</p><form id="editor-login-form" class="editor-form"><div><label for="editor-user">اسم المستخدم</label><input id="editor-user" type="text" autocomplete="username" required placeholder="اسم المستخدم"></div><div><label for="editor-pass">كلمة السر</label><input id="editor-pass" type="password" autocomplete="current-password" required placeholder="كلمة السر"></div><button type="submit" class="button wine">دخول المشرف ${icon('arrow')}</button><div id="editor-error" role="status" class="editor-hint" aria-live="polite"></div></form>`, `<button class="button secondary" data-action="close-modal">رجوع</button>`);document.getElementById('editor-user')?.focus()}
async function attemptLogin(){const username=document.getElementById('editor-user')?.value.trim(),pass=document.getElementById('editor-pass')?.value;const error=document.getElementById('editor-error');if(!username||!pass)return;try{const cfg=state.editorConfig;const test=await passwordHash(pass,cfg.salt,cfg.iterations);if(username!==cfg.username||test!==cfg.hash){error.textContent='اسم المستخدم أو كلمة السر مش صح.';return}state.isEditor=true;document.getElementById('modal-container').innerHTML='';updateEditorButton();render();toast('أهلًا بيك في وضع المشرف')}catch(e){error.textContent='لازم تفتح الصفحة من https أو متصفح بيدعم تسجيل الدخول.'}}

function saveToFile(name,text,mime){let b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportSteps(){if(!state.isEditor)return showLogin();const data={format:'ELNOUBEY_BARISTA_EDITS_V3',exportedAt:new Date().toISOString(),steps:state.overrides,itemOverrides:state.itemOverrides};saveToFile('Elnoubey_Barista_Backup.json',JSON.stringify(data,null,2),'application/json');toast('النسخة الاحتياطية اتنزّلت')}
function importSteps(file){if(!state.isEditor)return showLogin();if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!['ELNOUBEY_BARISTA_EDITS_V3','ELNOUBEY_BARISTA_SOP_V1'].includes(data.format))throw Error('bad');if(!confirm('هنحدّث التعديلات اللي على الجهاز ده. نكمّل؟'))return;const steps=data.steps||data.items||{};let n=0;for(const [id,obj] of Object.entries(steps)){if(!byId.has(id)||!Array.isArray(obj.steps))continue;state.overrides[id]={steps:obj.steps.map(x=>String(x).slice(0,1000)).filter(Boolean).slice(0,25),approved:!!obj.approved,updatedAt:obj.updatedAt||new Date().toISOString()};n++}for(const [id,o] of Object.entries(data.itemOverrides||{})){if(!byId.has(id)||!Array.isArray(o.ingredients)||!Array.isArray(o.packaging))continue;const item=byId.get(id),orig=DATA.items.find(x=>x.id===id);if(o.ingredients.length!==orig.ingredients.length||o.packaging.length!==orig.packaging.length)continue;const safe=r=>r.map((v,i)=>({...v,qty:v.qty===null?null:(Number.isFinite(Number(v.qty))?Number(v.qty):null),unit:String(v.unit||'').slice(0,35),name:String(v.name||'').slice(0,120),code:String(v.code||'').slice(0,40)}));item.ingredients=safe(o.ingredients);item.packaging=safe(o.packaging);state.itemOverrides[id]={ingredients:item.ingredients,packaging:item.packaging,updatedAt:new Date().toISOString()}}localStorage.setItem('elnoubey_steps_v3',JSON.stringify(state.overrides));localStorage.setItem('elnoubey_items_v3',JSON.stringify(state.itemOverrides));render();toast('التعديلات اتحمّلت')}catch(e){toast('ملف النسخة الاحتياطية مش مناسب')}};reader.readAsText(file)}
function downloadSite(){if(!state.isEditor)return showLogin();const doc=document.documentElement.cloneNode(true);const el=doc.querySelector('#elnoubey-published-config');const data={editor:state.editorConfig,steps:state.overrides,itemOverrides:state.itemOverrides};el.textContent=JSON.stringify(data).replace(/</g,'\\u003c');for(const id of ['page','modal-container','toast-container','primary-nav','category-nav','search-results']){let node=doc.querySelector('#'+id);if(node)node.innerHTML=''}const search=doc.querySelector('#search-input');if(search)search.removeAttribute('value');const serialized='<!doctype html>\n'+doc.outerHTML;saveToFile('index.html',serialized,'text/html;charset=utf-8');toast('نزّلنا index.html الجديد — ارفعه على GitHub')}
document.addEventListener('click',(e)=>{const el=e.target.closest('[data-action],[data-go],[data-filter]');if(!el){if(!e.target.closest('#search-wrap'))searchResults.hidden=true;return}if(e.target.closest('.modal')&&el.classList.contains('modal-backdrop'))return;if(el.dataset.go){navigate(el.dataset.go);search.value='';state.query='';return}if(el.dataset.filter){state.filter=el.dataset.filter;renderListWithoutScroll();return}const a=el.dataset.action,id=el.dataset.id,ind=+el.dataset.index;
switch(a){case'drawer':state.drawer=!state.drawer;document.getElementById('sidebar').classList.toggle('open',state.drawer);document.getElementById('drawer-backdrop').classList.toggle('visible',state.drawer);break;
case'fullscreen':if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>toast('ملء الشاشة غير متاح هنا'));else document.exitFullscreen?.();break;
case'favorite':state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);remember();render();toast(state.favorites.has(id)?'أُضيف إلى المفضلة':'أُزيل من المفضلة');break;
case'print':window.print();break;
case'copycode':if(navigator.clipboard?.writeText)navigator.clipboard.writeText(id).then(()=>toast('تم نسخ الكود')).catch(()=>toast(id));else toast(id);break;
case'check-ingredient':{let x=new Set(state.checked[id]||[]);x.has(ind)?x.delete(ind):x.add(ind);state.checked[id]=[...x];renderIngredientProgress(id,ind,x);break}
case'reset-ingredient':state.checked[id]=[];render();break;
case'check-step':{let x=new Set(state.done[id]||[]);x.has(ind)?x.delete(ind):x.add(ind);state.done[id]=[...x];el.classList.toggle('done',x.has(ind));break}
case'editor-access':state.isEditor?logout():showLogin();break;case'edit-ingredients':editIngredients(id);break;case'save-ingredients':saveIngredients(id);break;case'download-site':downloadSite();break;case'change-password':changePasswordModal();break;case'edit-steps':editModal(id);break;case'close-modal':document.getElementById('modal-container').innerHTML='';break;
case'save-steps':saveSteps(id);break;
case'export':exportSteps();break;case'import':document.getElementById('import-file').click();break;
case'clear-search':state.query='';search.value='';render();break;
}});
function renderIngredientProgress(id,ind,x){const it=byId.get(id);const row=document.querySelectorAll('.ingredients-panel .ingredient')[ind];if(row){row.classList.toggle('checked',x.has(ind));row.querySelector('.checkline').classList.toggle('checked',x.has(ind))}const count=document.querySelector('.ingredient-progress b');if(count)count.textContent=`${x.size} / ${it.ingredients.length}`;let bar=document.querySelector('.ingredient-progress .progress-bar div');if(bar)bar.style.width=`${Math.round(100*x.size/it.ingredients.length)}%`}
search.addEventListener('input',displaySearch);search.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=clean(search.value);let match=DATA.items.find(it=>clean([it.name,it.en,it.id,it.cat].join(' ')).includes(q));if(q&&match){navigate('/item/'+match.id);search.value='';state.query='';searchResults.hidden=true;e.preventDefault()}}if(e.key==='Escape'){searchResults.hidden=true;search.blur()}});
document.addEventListener('submit',e=>{if(e.target.id==='editor-login-form'){e.preventDefault();attemptLogin()}if(e.target.id==='change-password-form'){e.preventDefault();changePassword()}});document.getElementById('drawer-backdrop').onclick=closeDrawer;document.getElementById('import-file').addEventListener('change',e=>{importSteps(e.target.files?.[0]);e.target.value=''});
document.addEventListener('keydown',e=>{if((e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key==='k'))&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();search.focus();search.select();return}if(e.key==='Escape'){document.getElementById('modal-container').innerHTML='';searchResults.hidden=true;closeDrawer();return}if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||document.getElementById('modal-container').innerHTML)return;if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.altKey){document.querySelector('[data-action="fullscreen"]')?.click();return}let p=route();if(p.startsWith('/item/')){const it=byId.get(p.split('/')[2]);if(!it)return;const c=DATA.items.filter(x=>x.cat===it.cat),i=c.findIndex(x=>x.id===it.id);if(e.key==='ArrowLeft'&&c[i+1])navigate('/item/'+c[i+1].id);else if(e.key==='ArrowRight'&&c[i-1])navigate('/item/'+c[i-1].id)}});
window.addEventListener('hashchange',render);
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
if(!location.hash)location.hash='#/home';updateEditorButton();render();
</script>
